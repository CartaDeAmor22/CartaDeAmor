<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#13070d">
  <title>Para Maria Luiza ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <div class="entry-screen" id="entryScreen">
    <div class="entry-content">
      <div class="entry-heart">♥</div>
      <p class="entry-small">uma surpresa para você</p>
      <h2>Maria Luiza</h2>
      <p>Preparei uma coisinha especial pra você... ❤️</p>
      <button id="startBtn" class="primary-btn" type="button">Começar ❤️</button>
    </div>
  </div>

  <main>
    <section class="hero">
      <div class="glow"></div>
      <p class="eyebrow">uma carta do meu coração</p>
      <h1>Para Maria Luiza <span>♥</span></h1>
      <p class="subtitle">Tem coisas que são difíceis de explicar... então eu resolvi escrever.</p>

      <!-- BOTÃO 100% DIRETO: abre outra página, sem JavaScript e sem âncora -->
      <a class="primary-btn open-btn" href="carta.html">Abrir minha carta 💌</a>
    </section>
  </main>

  <div class="music-player" aria-label="Player de música">
    <div class="track-cover" id="trackCover"><span>♥</span></div>
    <div class="track-info">
      <strong id="trackName">Nossa música</strong>
      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="100" value="0" aria-label="Progresso da música">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-buttons">
      <button id="prevBtn" type="button" aria-label="Música anterior">↶</button>
      <button id="playBtn" class="play" type="button" aria-label="Reproduzir">▶</button>
      <button id="nextBtn" type="button" aria-label="Próxima música">↷</button>
    </div>
    <div class="volume-wrap">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Volume">
    </div>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
